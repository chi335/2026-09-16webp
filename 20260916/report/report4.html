<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <title>가로형 로그인 폼</title>
    <style>
        /* fieldset 내부 요소를 가로(row) 방향으로 정렬 */
        fieldset {
            display: flex;
            flex-direction: row;
            align-items: center; /* 세로 중앙 정렬 */
            gap: 15px;           /* 각 입력 항목 사이의 간격 */
            padding: 20px;
            border: 2px solid #4A90E2;
            border-radius: 8px;
            width: fit-content;  /* 내용물 크기에 맞게 너비 조절 */
        }

        /* legend 스타일 */
        legend {
            font-weight: bold;
            color: #4A90E2;
            padding: 0 5px;
        }

        /* label과 input을 한 쌍으로 가로 정렬 */
        .input-item {
            display: flex;
            align-items: center;
            gap: 8px; /* label과 input 사이 간격 */
        }

        /* input 박스 스타일 */
        input {
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        /* 로그인 버튼 스타일 */
        .login-btn {
            padding: 7px 15px;
            background-color: #4A90E2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .login-btn:hover {
            background-color: #357ABD;
        }
    </style>
</head>

<body>

    <h3>로그인 정보를 입력해주세요.</h3>
    <hr>

    <form>
        <fieldset>
            <legend>로그인</legend>

            <!-- 아이디 입력 영역 -->
            <div class="input-item">
                <label for="user-id">아이디</label>
                <input type="text" id="user-id" placeholder="아이디 입력" required>
            </div>

            <!-- 비밀번호 입력 영역 -->
            <div class="input-item">
                <label for="user-pw">비밀번호</label>
                <input type="password" id="user-pw" placeholder="비밀번호 입력" required>
            </div>

            <!-- 로그인 버튼 -->
            <button type="submit" class="login-btn">로그인</button>
        </fieldset>
    </form>

</body>

</html>

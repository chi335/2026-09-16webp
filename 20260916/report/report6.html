<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>도형서식폼 만들기</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 30px;
            background-color: #f8f9fa;
        }

        /* 헤더 제목 스타일 */
        h2 {
            color: #222222;
            margin-bottom: 10px;
        }

        /* 구분선 스타일 */
        hr {
            border: none;
            border-top: 1px solid #ccc;
            margin-bottom: 25px;
        }

        /* 선으로 감싸는 네모 박스 스타일 */
        fieldset {
            border: 2px solid #333333; /* 검은색/진회색 명확한 테두리 */
            border-radius: 6px;
            padding: 20px 25px;
            width: 340px;
            background-color: #ffffff;
        }

        /* 네모 박스 상단 테두리에 위치하는 제목 스타일 */
        legend {
            font-weight: bold;
            font-size: 1.1rem;
            color: #333333;
            padding: 0 10px; /* 제목 양옆 텍스트 여백 */
        }

        /* 폼 내부 레이아웃 */
        .form-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #333;
        }

        /* 입력 컨트롤 스타일 */
        select, 
        input[type="number"], 
        input[type="color"] {
            width: 150px;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        input[type="color"] {
            height: 35px;
            padding: 2px;
            cursor: pointer;
        }

        .range-box {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 150px;
        }

        input[type="range"] {
            width: 100px;
            cursor: pointer;
        }

        output {
            font-size: 0.85rem;
            color: #666;
            width: 40px;
        }

        /* 적용 버튼 */
        .apply-btn {
            width: 100%;
            padding: 10px;
            background-color: #333333;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .apply-btn:hover {
            background-color: #555555;
        }
    </style>
</head>
<body>

    <!-- 헤더 영역 -->
    <h2>도형서식폼 만들기</h2>
    <hr>

    <form>
        <!-- 네모 박스를 만들어주는 fieldset -->
        <fieldset>
            <!-- 테두리 중앙 상단에 위치하는 제목 -->
            <legend>도형서식입력</legend>

            <!-- 1. 선 종류 (카테고리 선택) -->
            <div class="form-group">
                <label for="line-style">선 종류</label>
                <select id="line-style" name="lineStyle">
                    <option value="none">선 없음</option>
                    <option value="solid" selected>실선</option>
                    <option value="dashed">파선(점선)</option>
                    <option value="dotted">점선</option>
                    <option value="double">이중선</option>
                </select>
            </div>

            <!-- 2. 선 두께 (숫자 입력) -->
            <div class="form-group">
                <label for="line-width">선 두께 (px)</label>
                <input type="number" id="line-width" name="lineWidth" min="0" max="50" value="1">
            </div>

            <!-- 3. 투명도 (눈금 조절) -->
            <div class="form-group">
                <label for="transparency">투명도</label>
                <div class="range-box">
                    <input type="range" id="transparency" name="transparency" min="0" max="100" value="0" 
                           oninput="transVal.value = this.value + '%'">
                    <output id="transVal">0%</output>
                </div>
            </div>

            <!-- 4. 색상 선택 -->
            <div class="form-group">
                <label for="line-color">선 색상</label>
                <input type="color" id="line-color" name="lineColor" value="#000000">
            </div>

            <button type="submit" class="apply-btn">서식 적용</button>
        </fieldset>
    </form>

</body>
</html>
